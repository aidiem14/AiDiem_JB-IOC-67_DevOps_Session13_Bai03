version: '3.8'

services:
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: quickbite-node-exporter
    restart: always
    # Mount các volume đặc biệt của Linux Host vào Container để lấy thông số thực
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    # Truyền lệnh chỉ định Node Exporter đọc dữ liệu từ các thư mục mount ở trên
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    # Kết nối vào mạng bridge ảo nội bộ chung với Prometheus
    networks:
      - quickbite-net
    # Bảo mật: Không publish port 9100 ra Internet, chỉ expose nội bộ cho Prometheus
    expose:
      - "9100"

networks:
  quickbite-net:
    external: true